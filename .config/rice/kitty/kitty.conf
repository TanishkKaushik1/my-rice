# ~/.config/rice/kitty/kitty.conf
# Mirrors the alacritty setup: same opacity/blur feel, same font,
# same pink cursor accent, colors driven by matugen.
# Symlinked from ~/.config/kitty/kitty.conf

# ─── Font ────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
font_size        11.25

# ─── Transparency / blur ─────────────────────────────────────────────
background_opacity         0.25
dynamic_background_opacity  yes

# ─── Cursor ───────────────────────────────────────────────────────────
cursor_shape          beam
cursor_blink_interval  0.5
cursor                 #ffb4ab

# ─── Window ───────────────────────────────────────────────────────────
window_padding_width      12
hide_window_decorations   yes
confirm_os_window_close   0

# ─── Shell ────────────────────────────────────────────────────────────
shell /bin/zsh

allow_remote_control yes
# ─── Matugen-managed color palette ───────────────────────────────────
# Regenerated automatically whenever matugen re-runs (e.g. on wallpaper change)
include ~/.config/rice/kitty/colors.conf