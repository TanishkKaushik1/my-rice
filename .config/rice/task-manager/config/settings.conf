# settings.conf
# User-tunable settings for the rice Task Manager.
#
# NOTE: QML doesn't parse .conf/.ini files natively out of the box — this file
# is a placeholder for values you may want exposed later via a small
# SettingsService.qml (read with Quickshell's FileView + a tiny key=value or
# INI parser, similar to how ColorService.qml reads matugen's JSON). For now,
# the same values are hardcoded as defaults in the relevant singletons:
#   - poll_interval_ms_ram_cpu -> services/SystemMonitor.qml (pollIntervalMs)
#   - poll_interval_ms_processes -> services/ProcessService.qml (pollIntervalMs)
#   - history_length -> services/SystemMonitor.qml (historyLength)
#   - window_width / window_height -> styles/Metrics.qml (windowWidth/Height)
#
# Treat this file as documentation + future config source, not yet wired live.

[polling]
poll_interval_ms_ram_cpu = 1500
poll_interval_ms_processes = 2000
history_length = 60

[window]
width = 900
height = 600
min_width = 640
min_height = 420
start_hidden = true

[behavior]
default_tab = processes
default_sort = cpu_desc
confirm_end_task = false

[theme]
matugen_colors_path = /home/tanishk/.config/rice/matugen/colors.json
watch_for_theme_changes = true
