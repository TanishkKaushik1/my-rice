background {
    monitor =
    path = /home/tanishk/.config/rice/hyprlock/1371145.jpeg
}
# 1. Digital Clock
label {
    monitor =
    text = $TIME
    color = rgb(240, 244, 248) # Ultra-bright metallic white
    font_size = 85
    font_family = Inter Nerd Font
    
    # Drop shadow to make it pop off the background
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgb(0, 0, 0)
    
    # Shifted higher to make room
    position = 250, 120
    halign = left
    valign = center
}

# 2. Personalized Greeting
label {
    monitor =
    text = Welcome back, Tanishk
    color = rgb(192, 192, 192) # Solid steel/silver
    font_size = 24
    font_family = Inter Nerd Font
    
    # Removed the shadow completely for crisp, clean small text
    shadow_passes = 0
    
    # Positioned cleanly between the clock and the box
    position = 230, 20
    halign = left
    valign = center
}

# 4. Gradient Border Password Box
input-field {
    monitor =
    size = 250, 45
    
    # Thicker outline to show off the metallic rim
    outline_thickness = 3
    
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    
    # Sharp high-contrast metallic gradient (Bright Silver to Deep Gunmetal)
    outer_color = rgb(ffffff) rgb(232629) 45deg
    
    # Extremely dark, glossy inner color for depth
    inner_color = rgb(10, 12, 14)
    font_color = rgb(255, 255, 255)
    font_family = Inter Nerd Font
    
    rounding = 8
    fade_on_empty = false
    placeholder_text = <i><span foreground="##e0e4db99">Enter password...</span></i>
    hide_input = false
    
    # Adding a shadow to the BOX ITSELF gives it 3D physical depth
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgb(0, 0, 0)
    
    # Positioned at the bottom of the stack
    position = 270, -150 
    halign = left
    valign = center
}
